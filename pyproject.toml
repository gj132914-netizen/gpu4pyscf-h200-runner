[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu4pyscf-h200-runner"
version = "0.1.0"
description = "H200-optimized PySCF/GPU4PySCF runner with OOM diagnostics and retry handling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyscf",
  "geometric",
]

[project.optional-dependencies]
cuda11 = [
  "cupy-cuda11x",
  "cutensor-cu11",
  "gpu4pyscf-cuda11x",
]
cuda12 = [
  "cupy-cuda12x",
  "cutensor-cu12",
  "gpu4pyscf-cuda12x",
]
cuda13 = [
  "cupy-cuda13x",
  "cutensor-cu13",
  "gpu4pyscf-cuda13x",
]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
g4pyscf-run = "gpu4pyscf_h200_runner.cli:main"
g4pyscf-check = "gpu4pyscf_h200_runner.diagnostics:main"
g4pyscf-env = "gpu4pyscf_h200_runner.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

